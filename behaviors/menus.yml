---
# behaviors/menus.yml
# 定义学生奖惩应用的菜单项

- name: 学生奖惩管理
  icon: icon-[tabler--gavel]
  is_group_header: true
  children:
      - name: 奖惩记录列表
        named_url: behaviors:conductrecord_list
        icon: icon-[tabler--list]
        is_visible: true
        login_required: true

      - name: 奖惩汇总
        named_url: behaviors:conductsummary_list
        icon: icon-[tabler--chart-bar]
        is_visible: true
        login_required: true

      - name: 录入奖惩记录
        named_url: behaviors:conductrecord_create
        icon: icon-[tabler--plus]
        is_visible: true
        login_required: true
        perm_match_all: false
        required_perms:
          - behaviors.add_conduct_record
