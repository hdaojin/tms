{% extends "behaviors/cycle_base.html" %}
{% block cycle_content %}
<section class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body">
  {% if cycles %}
  <form method="get" class="flex flex-wrap items-end gap-3">
    <label class="fieldset">
      <span class="fieldset-legend">训练周期</span>
      <select class="select" name="cycle" required>
        <option value="">请选择训练周期</option>
        {% for cycle in cycles %}<option value="{{ cycle.pk }}">{{ cycle }}</option>{% endfor %}
      </select>
    </label>
    <button class="btn btn-primary" type="submit">进入</button>
  </form>
  {% else %}<p>暂无可用的训练周期。</p>{% endif %}
</div></section>
{% endblock %}
