{% extends "base.html" %}
{% load render_table from django_tables2 %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">
            <span class="icon-[tabler--trophy] size-8 text-warning"></span>
            {{ title }}
        </h1>
    </div>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            {% if table.data %}
                {% render_table table %}
            {% else %}
                <div class="text-center py-8">
                    <span class="icon-[tabler--mood-empty] size-16 text-base-300"></span>
                    <p class="text-lg text-base-content/60 mt-4">暂无数据</p>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
