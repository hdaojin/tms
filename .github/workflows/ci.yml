name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3
      PRIVATE_MEDIA_ROOT: media-private
      SAMBA_INTEGRATION_ENABLED: "False"
      SAMBA_ASYNC_OPERATIONS_ENABLED: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev libpq-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Django system checks
        run: uv run manage.py check

      - name: Verify migrations are up to date
        run: uv run manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run manage.py migrate --noinput

      - name: Generate marking workbook fixture
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook

          output = Path('media/CMP_marking_scheme_example.xlsx')
          output.parent.mkdir(parents=True, exist_ok=True)

          wb = Workbook()
          ws = wb.active
          ws.title = 'Marking Scheme Import'
          ws.cell(row=1, column=1).value = 'CMP Marking Scheme Example'
          ws.cell(row=2, column=1).value = 'ID'
          ws.cell(row=2, column=2).value = 'Name'
          ws.cell(row=2, column=3).value = 'Mark'
          ws.cell(row=3, column=1).value = 'A'
          ws.cell(row=3, column=2).value = 'Linux environments'
          ws.cell(row=3, column=3).value = 3.60

          headers = [
              'Sub Criterion ID',
              'Sub Criterion Name or Description',
              'Day of Marking',
              'Aspect Type M = Meas J = Judg',
              'Aspect - Description',
              'Judg Score',
              'Extra Aspect Description (Meas or Judg) or Judgement Score Description (Judg Only)',
              'Requirement (Measurement Only)',
              'WSOS Section',
              'Calculation Row (Export Only)',
              'Max Mark',
          ]
          for column, header in enumerate(headers, start=1):
              ws.cell(row=6, column=column).value = header

          def subcriterion(row, code, name):
              ws.cell(row=row, column=1).value = code
              ws.cell(row=row, column=2).value = name
              ws.cell(row=row, column=3).value = 'Day 1'

          def measurement(row, description, mark):
              ws.cell(row=row, column=4).value = 'M'
              ws.cell(row=row, column=5).value = description
              ws.cell(row=row, column=7).value = f'Run command for {description}'
              ws.cell(row=row, column=8).value = f'Expected result for {description}'
              ws.cell(row=row, column=9).value = 'WSSS 1'
              ws.cell(row=row, column=11).value = mark

          def judgement(row, description, mark):
              ws.cell(row=row, column=4).value = 'J'
              ws.cell(row=row, column=5).value = description
              ws.cell(row=row, column=7).value = f'Evaluate {description}'
              ws.cell(row=row, column=9).value = 'WSSS 2'
              ws.cell(row=row, column=11).value = mark
              for offset, score in enumerate((0, 1, 2, 3), start=1):
                  option_row = row + offset
                  ws.cell(row=option_row, column=6).value = score
                  ws.cell(row=option_row, column=7).value = f'{score} point description'

          subcriterion(7, 'A1', 'System preparation')
          measurement(8, 'Hostname configured', 0.20)
          measurement(9, 'Network configured', 0.20)
          measurement(10, 'Repository configured', 0.20)
          subcriterion(11, 'A2', 'Service deployment')
          measurement(12, 'SSH configured', 0.20)
          judgement(13, 'Service quality judgement', 1.40)
          subcriterion(18, 'A3', 'Security and validation')
          measurement(19, 'Firewall configured', 0.20)
          measurement(20, 'Users configured', 0.20)
          measurement(21, 'Permissions configured', 0.20)
          measurement(22, 'Logs configured', 0.20)
          measurement(23, 'Final validation', 0.60)
          ws.cell(row=24, column=10).value = 'Total Marks:'
          ws.cell(row=24, column=11).value = 3.60

          wb.save(output)
          PY

      - name: Run tests
        run: |
          set -o pipefail
          uv run manage.py test 2>&1 | tee django-test.log

      - name: Upload Django test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-log
          path: django-test.log
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css
