name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3
      PRIVATE_MEDIA_ROOT: media-private
      SAMBA_INTEGRATION_ENABLED: "False"
      SAMBA_ASYNC_OPERATIONS_ENABLED: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Django system checks
        run: uv run manage.py check

      - name: Verify migrations are up to date
        run: uv run manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run manage.py migrate --noinput

      - name: Run tests
        run: |
          set -o pipefail
          uv run pytest -m "not document_pdf_native" 2>&1 | tee pytest-test.log

      - name: Upload pytest test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-log
          path: pytest-test.log
          if-no-files-found: ignore

  document-pdf:
    name: Document PDF rendering on Debian 13
    runs-on: ubuntu-latest
    container: debian:13
    env:
      DEBUG: "True"
      DATABASE_URL: "sqlite:///:memory:"
      SAMBA_INTEGRATION_ENABLED: "False"
      SAMBA_ASYNC_OPERATIONS_ENABLED: "False"
    steps:
      - name: Install PDF system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libpq5 fontconfig fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check PDF renderer and DEBUG document demo
        run: |
          uv run manage.py check_document_pdf
          uv run pytest -o django_debug_mode=keep core/test_document_export.py demo/test_documents.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Verify generated frontend assets are committed
        run: |
          status_file="${RUNNER_TEMP}/frontend-status.txt"
          git status --porcelain --untracked-files=all --ignored=matching -- \
            static/css/output.css \
            static/js/alpinejs.min.js \
            static/js/mermaid.min.js \
            static/js/mermaid.LICENSE.txt \
            static/vendor/filepond/esm > "${status_file}"
          cat "${status_file}"
          test ! -s "${status_file}"

      - name: Audit production npm dependencies
        run: npm audit --omit=dev
