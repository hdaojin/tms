name: Python dependency audit

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - uv.lock
      - pyproject.toml
      - .github/workflows/python-dependency-audit.yml

permissions:
  contents: read

jobs:
  locked-audit:
    name: Audit locked Python production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - run: uv --preview-features audit-command audit --frozen --no-dev --python-version 3.13 --python-platform linux
