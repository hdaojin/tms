version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        update-types: [minor, patch]
