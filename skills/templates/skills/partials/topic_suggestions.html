{% if query %}
  {% if not module %}
    <p class="text-sm text-base-content/60">请先选择标准模块，再检查是否已有同名专题。</p>
  {% elif suggestions %}
    <div class="alert alert-warning items-start">
      <span class="icon-[tabler--alert-triangle] mt-1 size-5"></span>
      <div class="space-y-2">
        <p class="font-semibold">当前模块下已有相近专题，建议优先复用：</p>
        <div class="flex flex-wrap gap-2">
          {% for topic in suggestions %}
            <span class="badge badge-outline badge-warning">{{ topic.name }}</span>
          {% endfor %}
        </div>
      </div>
    </div>
  {% else %}
    <p class="text-sm text-base-content/60">当前模块下未找到同名或相近专题，可以继续新建。</p>
  {% endif %}
{% endif %}
