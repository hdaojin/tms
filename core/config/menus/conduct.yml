          is_visible: true
          login_required: true

        - name: "奖惩汇总"
          named_url: "conduct:conductsummary_list"
          icon: 
            pic: "icon-[tabler--chart-bar]"
            size: 4
          is_visible: true
          login_required: true

        - name: "录入奖惩记录"
          named_url: "conduct:conductrecord_create"
          icon: 
            pic: "icon-[tabler--plus]"
            size: 4
          is_visible: true
          login_required: true
          perm_match_all: false
