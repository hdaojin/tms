---
# 定义学生奖惩管理应用的菜单项

menu_slug: "conduct"
app_name: "conduct"
items:
  - name: "学生奖惩管理"
    icon: 
      pic: "icon-[tabler--trophy]"
      size: 4
    is_group_header: true
    children:
        - name: "我的奖惩"
          named_url: "conduct:my_conduct"
          icon: 
            pic: "icon-[tabler--user-check]"
            size: 4
          is_visible: true
          login_required: true
          description: "查看个人奖惩记录和得分"

        - name: "奖惩记录"
          named_url: "conduct:record_list"
          icon: 
            pic: "icon-[tabler--file-text]"
            size: 4
          is_visible: true
          login_required: true
          perm_match_all: false
          required_perms:
              - "conduct.view_conductrecord"
          description: "查看和管理奖惩记录"

        - name: "录入记录"
          named_url: "conduct:record_create"
          icon: 
            pic: "icon-[tabler--plus]"
            size: 4
          is_visible: true
          login_required: true
          perm_match_all: true
          required_perms:
              - "conduct.add_conduct_record"
          description: "为学生录入奖惩记录"

        - name: "排行榜"
          named_url: "conduct:summary_list"
          icon: 
            pic: "icon-[tabler--trophy]"
            size: 4
          is_visible: true
          login_required: true
          perm_match_all: false
          required_perms:
              - "conduct.view_conductsummary"
          description: "查看学生奖惩排行榜"

        - name: "奖惩类型"
          named_url: "conduct:type_list"
          icon: 
            pic: "icon-[tabler--category]"
            size: 4
          is_visible: true
          login_required: true
          perm_match_all: true
          required_perms:
              - "conduct.manage_conduct_types"
          description: "管理奖惩类型"
