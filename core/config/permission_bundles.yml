    permissions: [scoring.view_scoringscheme, scoring.view_scoringsubcriterion, scoring.view_scoringaspect, scoring.view_judgementoption]
  - code: scoring.view_own_results
    name: 评分 | 查看本人评分结果
    description: 查看与本人关联的参评对象和评分结果。
    permissions: [scoring.view_scoringparticipant, scoring.view_scoringresult]
  - code: scoring.view_all_results
    name: 评分 | 查看全部评分结果
    description: 将参评对象和评分结果范围扩大到全部人员。
    permissions: [scoring.view_scoringparticipant, scoring.view_scoringresult, scoring.view_all_scoringparticipant, scoring.view_all_scoringresult]
  - code: scoring.maintain_scoring
    name: 评分 | 维护评分
    description: 导入评分表并维护参评对象和评分结果。
    permissions: [scoring.view_scoringscheme, scoring.add_scoringscheme, scoring.change_scoringscheme, scoring.view_scoringparserconfig, scoring.view_scoringschemeimport, scoring.add_scoringschemeimport, scoring.change_scoringschemeimport, scoring.view_scoringsubcriterion, scoring.view_scoringaspect, scoring.view_judgementoption, scoring.view_scoringparticipant, scoring.add_scoringparticipant, scoring.change_scoringparticipant, scoring.view_all_scoringparticipant, scoring.view_scoringresult, scoring.add_scoringresult, scoring.change_scoringresult, scoring.view_all_scoringresult, scoring.view_scoringresultimport, scoring.add_scoringresultimport, scoring.change_scoringresultimport]

