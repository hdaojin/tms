    description: 按业务范围查看竞赛、考核、模块、人员和资料。
    permissions: [assessments.view_assessmentseries, assessments.view_assessmentlevel, assessments.view_assessment, assessments.view_assessmentmodule, assessments.view_assessmentmoduledomain, assessments.view_assessmentmodulecoach, assessments.view_assessmentparticipant, assessments.view_assessmentresultsummary, assessments.view_assessmentdocument]
