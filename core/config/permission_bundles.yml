    name: 竞赛与考核 | 维护
    description: 按技术领域维护模块、人员和业务资料。
    permissions: [assessments.view_assessment, assessments.add_assessment, assessments.change_assessment, assessments.view_assessmentmodule, assessments.add_assessmentmodule, assessments.change_assessmentmodule, assessments.view_assessmentparticipant, assessments.add_assessmentparticipant, assessments.change_assessmentparticipant, assessments.view_assessmentdocument, assessments.add_assessmentdocument, assessments.change_assessmentdocument]

