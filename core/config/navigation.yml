---
themes:
  - light
  - dark
  - corporate
  - business
  - night

layouts:
  header:
    - home
    - assessments
    - feedback
    - worldskills_forum
    - standards
    - training
    - behaviors
    - about
  dashboard:
    - notice
    - feedback
    - worldskills_forum
    - standards
    - training
    - assessments
    - resources
    - behaviors
    - meetings

sections:
  - key: home
    label: 首页
    description: 系统首页
    icon_class: icon-[tabler--home] size-5 text-primary
    login_required: false
    items:
      - key: home
        label: 首页
        url_name: home
        icon_class: icon-[tabler--home] size-5 text-primary
        login_required: false

  - key: notice
    label: 通知
    description: 通知公告与待办
    icon_class: icon-[tabler--bell] size-5 text-info
    items:
      - key: notice_group
        label: 通知公告
        icon_class: icon-[tabler--bell] size-5 text-info
        children:
          - key: notices
            label: 通知公告列表
            url_name: notices:notice_list
            icon_class: icon-[tabler--bell] size-5 text-info
            permissions: [notices.view_notice]
          - key: notices_create
            label: 创建通知公告
            url_name: notices:notice_create
            icon_class: icon-[tabler--send] size-5 text-primary
            permissions:
              - notices.add_notice

  - key: feedback
    label: 反馈
    description: 意见反馈与问题跟踪
    icon_class: icon-[tabler--message-report] size-5 text-primary
    items:
      - key: feedback_group
        label: 意见反馈
        icon_class: icon-[tabler--message-report] size-5 text-primary
        children:
          - key: feedback
            label: 意见反馈列表
            url_name: feedback:list
            icon_class: icon-[tabler--message-report] size-5 text-primary
            login_required: true
          - key: feedback_create
            label: 提交反馈
            url_name: feedback:create
            icon_class: icon-[tabler--message-plus] size-5 text-success
            login_required: true

  - key: worldskills_forum
    label: 世赛论坛
    description: 世界技能论坛翻译与讨论信息
    icon_class: icon-[tabler--messages] size-5 text-info
    items:
      - key: worldskills_forum_group
        label: 世赛论坛
        icon_class: icon-[tabler--messages] size-5 text-info
        children:
          - key: worldskills_forum
            label: 最新动态
            url_name: worldskills_forum:feed
            icon_class: icon-[tabler--news] size-5 text-info
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_topics
            label: 主题
            url_name: worldskills_forum:topic_list
            icon_class: icon-[tabler--message-circle] size-5 text-primary
            permissions: [worldskills_forum.view_forumtopic]
          - key: worldskills_forum_important
            label: 重要信息
            url_name: worldskills_forum:important_feed
            icon_class: icon-[tabler--alert-triangle] size-5 text-warning
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_official
            label: 官方信息
            url_name: worldskills_forum:official_feed
            icon_class: icon-[tabler--rosette] size-5 text-info
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_unread
            label: 未读信息
            url_name: worldskills_forum:unread_feed
            icon_class: icon-[tabler--mail] size-5 text-secondary
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_workbench
            label: 翻译工作台
            url_name: worldskills_forum:workbench
            icon_class: icon-[tabler--language] size-5 text-accent
            permissions:
              - worldskills_forum.add_forumpost

  - key: training
    label: 训练
    description: 训练周期、计划、任务、执行与日志
    icon_class: icon-[tabler--run] size-5 text-success
    items:
      - key: training_group
        label: 训练管理
        icon_class: icon-[tabler--run] size-5 text-success
        children:
          - key: training
            label: 训练周期
            url_name: training:cycle_list
            icon_class: icon-[tabler--calendar-stats] size-5 text-success
            permissions: [training.view_trainingcycle]
          - key: training_create
            label: 新增训练周期
            url_name: training:cycle_create
            icon_class: icon-[tabler--plus] size-5 text-success
            permissions:
              - training.add_trainingcycle
          - key: training_plans
            label: 训练计划
            url_name: training:plan_list
            icon_class: icon-[tabler--calendar-stats] size-5 text-success
            permissions: [training.view_trainingplan]
          - key: training_tasks
            label: 训练任务
            url_name: training:task_list
            icon_class: icon-[tabler--list-check] size-5 text-success
            permissions: [training.view_trainingtask]
          - key: my_training
            label: 我的训练
            url_name: training:my_training
            icon_class: icon-[tabler--run] size-5 text-success
            permissions: [training.view_trainingtask]
          - key: training_logs
            label: 训练日志
            url_name: training:log_list
            icon_class: icon-[tabler--file-text] size-5 text-success
            permissions: [training.view_traininglog]
          - key: training_log_create
            label: 新增训练日志
            url_name: training:log_create
            icon_class: icon-[tabler--upload] size-5 text-success
            permissions:
              - training.add_traininglog
      - key: glossary_learning_group
        label: 专业词汇学习
        icon_class: icon-[tabler--language] size-5 text-accent
        children:
          - key: glossary
            label: 词条浏览
            url_name: glossary:browse
            icon_class: icon-[tabler--list-letters] size-5 text-accent
            permissions: [glossary.view_glossaryentry]
          - key: glossary_study
            label: 开始学习
            url_name: glossary:study_start
            icon_class: icon-[tabler--brain] size-5 text-success
            permissions: [glossary.view_glossaryentry, glossary.add_studysession]
          - key: glossary_my_stats
            label: 我的统计
            url_name: glossary:my_stats
            icon_class: icon-[tabler--chart-bar] size-5 text-info
            permissions: [glossary.view_studysession]
          - key: glossary_proposals
            label: 词条提案
            url_name: glossary:proposal_list
            icon_class: icon-[tabler--message-plus] size-5 text-warning
            permissions:
              - glossary.view_glossaryentryproposal
      - key: glossary_manage_group
        label: 专业词库管理
        icon_class: icon-[tabler--books] size-5 text-warning
        children:
          - key: glossary_manage
            label: 词库管理
            url_name: glossary:glossary_list
            icon_class: icon-[tabler--books] size-5 text-warning
            permissions:
              - glossary.change_professionalglossary
          - key: glossary_imports
            label: 导入记录
            url_name: glossary:import_list
            icon_class: icon-[tabler--file-spreadsheet] size-5 text-success
            permissions:
              - glossary.view_glossaryimport
          - key: glossary_all_stats
            label: 全部学习统计
            url_name: glossary:all_stats
            icon_class: icon-[tabler--chart-histogram] size-5 text-info
            permissions:
              - glossary.view_all_study_statistics

  - key: assessments
    label: 竞赛与考核
    description: 竞赛、考核、模块、资料与评分
    icon_class: icon-[tabler--trophy] size-5 text-warning
    items:
      - key: assessment_catalog
        label: 竞赛与考核
        icon_class: icon-[tabler--trophy] size-5 text-warning
        children:
          - key: assessments
            label: 竞赛与考核列表
            url_name: assessments:assessment_list
            icon_class: icon-[tabler--trophy] size-5 text-warning
            permissions: [assessments.view_assessment]
          - key: assessment_create
            label: 新增竞赛与考核
            url_name: assessments:assessment_create
            icon_class: icon-[tabler--plus] size-5 text-warning
            permissions:
              - assessments.add_assessment
          - key: assessment_modules
            label: 评测模块
            url_name: assessments:module_list
            icon_class: icon-[tabler--stairs] size-5 text-warning
            permissions: [assessments.view_assessmentmodule]
          - key: assessment_module_create
            label: 新增评测模块
            url_name: assessments:module_create
            icon_class: icon-[tabler--plus] size-5 text-warning
            permissions:
              - assessments.add_assessmentmodule
      - key: assessment_operations
        label: 评测资料与人员
        icon_class: icon-[tabler--calendar-event] size-5 text-warning
        children:
          - key: assessment_documents
            label: 上传评测资料
            url_name: assessments:document_upload
            icon_class: icon-[tabler--calendar-event] size-5 text-warning
            permissions: [assessments.add_assessmentdocument]
          - key: assessment_participant_create
            label: 新增参与人员
            url_name: assessments:participant_create
            icon_class: icon-[tabler--plus] size-5 text-warning
            permissions:
              - assessments.add_assessmentparticipant
      - key: evidence_group
        label: 考点证据
        icon_class: icon-[tabler--file-analytics] size-5 text-warning
        children:
          - key: evidence
            label: 考点证据列表
            url_name: evidence:evidence_list
            icon_class: icon-[tabler--file-analytics] size-5 text-warning
            permissions: [evidence.view_knowledgeevidence]
          - key: evidence_create
            label: 新增考点证据
            url_name: evidence:evidence_create
            icon_class: icon-[tabler--plus] size-5 text-warning
            permissions:
              - evidence.add_knowledgeevidence
      - key: scoring_group
        label: 评分管理
        icon_class: icon-[tabler--clipboard-check] size-5 text-primary
        children:
          - key: scoring
            label: 评分方案
            url_name: scoring:scheme_list
            icon_class: icon-[tabler--clipboard-check] size-5 text-primary
            permissions: [scoring.view_scoringscheme]
          - key: scoring_import
            label: 导入评分表
            url_name: scoring:scheme_import
            icon_class: icon-[tabler--upload] size-5 text-primary
            permissions:
              - scoring.add_scoringscheme
          - key: scoring_participant_create
            label: 新增参评对象
            url_name: scoring:participant_create
            icon_class: icon-[tabler--user-plus] size-5 text-primary
            permissions:
              - scoring.add_scoringparticipant
          - key: scoring_result_create
            label: 录入评分结果
            url_name: scoring:result_create
            icon_class: icon-[tabler--edit] size-5 text-primary
            permissions:
              - scoring.add_scoringresult

  - key: standards
    label: 标准
    description: 标准体系与考点知识库
    icon_class: icon-[tabler--target-arrow] size-5 text-info
    items:
      - key: standards_group
        label: 标准体系
        icon_class: icon-[tabler--target-arrow] size-5 text-info
        children:
          - key: standards
            label: 技能项目
            url_name: standards:project_list
            icon_class: icon-[tabler--target-arrow] size-5 text-info
            permissions: [standards.view_skillproject]
          - key: standards_create
            label: 新增技能项目
            url_name: standards:project_create
            icon_class: icon-[tabler--plus] size-5 text-info
            permissions:
              - standards.add_skillproject
          - key: standards_skills
            label: 技能目录
            url_name: standards:skill_catalog_entry
            icon_class: icon-[tabler--target] size-5 text-info
            permissions: [standards.view_skill]
          - key: standards_trees
            label: 标准技能树版本
            url_name: standards:tree_list
            icon_class: icon-[tabler--hierarchy-3] size-5 text-success
            permissions: [standards.view_skilltreeversion]
          - key: standards_tree_create
            label: 新增标准技能树版本
            url_name: standards:tree_create
            icon_class: icon-[tabler--plus] size-5 text-success
            permissions:
              - standards.add_skilltreeversion
          - key: standards_wsos
            label: WSOS 版本
            url_name: standards:wsos_list
            icon_class: icon-[tabler--list-details] size-5 text-accent
            permissions: [standards.view_wsosversion]
          - key: standards_wsos_create
            label: 新增 WSOS 版本
            url_name: standards:wsos_create
            icon_class: icon-[tabler--plus] size-5 text-accent
            permissions: [standards.add_wsosversion]

  - key: resources
    label: 资料
    description: 教学笔记
    icon_class: icon-[tabler--files] size-5 text-primary
    items:
      - key: notes_group
        label: 教学笔记
        icon_class: icon-[tabler--book] size-5 text-warning
        children:
          - key: notes
            label: 笔记仓库
            url_name: notes:repo_list
            icon_class: icon-[tabler--book] size-5 text-warning
            permissions: [notes.view_noterepo]

  - key: meetings
    label: 会议
    description: 会议记录
    icon_class: icon-[tabler--calendar] size-5 text-primary
    items:
      - key: meeting_group
        label: 会议记录
        icon_class: icon-[tabler--calendar] size-5 text-primary
        children:
          - key: meetings
            label: 会议记录
            url_name: meetings:meeting_list
            icon_class: icon-[tabler--calendar] size-5 text-primary
            permissions: [meetings.view_meeting]
          - key: meeting_upload
            label: 上传会议记录
            url_name: meetings:meeting_upload
            icon_class: icon-[tabler--calendar-plus] size-5 text-primary
            permissions:
              - meetings.add_meeting

  - key: behaviors
    label: 奖惩
    description: 学生奖惩管理
    icon_class: icon-[tabler--gavel] size-5 text-secondary
    items:
      - key: behavior_group
        label: 奖惩管理
        icon_class: icon-[tabler--gavel] size-5 text-secondary
        children:
          - key: behaviors
            label: 奖惩记录
            url_name: behaviors:conductrecord_list
            icon_class: icon-[tabler--gavel] size-5 text-secondary
            permissions: [behaviors.view_conductrecord]
          - key: behavior_create
            label: 录入奖惩记录
            url_name: behaviors:conductrecord_create
            icon_class: icon-[tabler--plus] size-5 text-secondary
            permissions:
              - behaviors.add_conduct_record
          - key: behavior_summary
            label: 操行汇总
            url_name: behaviors:conductsummary_list
            icon_class: icon-[tabler--chart-donut] size-5 text-info
            permissions: [behaviors.view_conductsummary]

  - key: account
    label: 账户
    description: 用户、角色与系统集成
    icon_class: icon-[tabler--user-cog] size-5 text-primary
    items:
      - key: account_self
        label: 个人账户
        icon_class: icon-[tabler--user] size-5 text-primary
        children:
          - key: accounts
            label: 用户中心
            url_name: accounts:home
            icon_class: icon-[tabler--user] size-5 text-primary
            permissions: [accounts.change_userprofile]
          - key: account_profile
            label: 个人资料
            url_name: accounts:profile
            icon_class: icon-[tabler--user-circle] size-5 text-primary
            permissions: [accounts.change_userprofile]
          - key: samba
            label: Samba 账户
            url_name: samba:accounts
            icon_class: icon-[tabler--server] size-5 text-info
            permissions: [samba.add_sambaoperation]
      - key: account_admin
        label: 系统管理
        icon_class: icon-[tabler--settings] size-5 text-neutral
        children:
          - key: users
            label: 用户管理
            url_name: accounts:user_list
            icon_class: icon-[tabler--users] size-5 text-primary
            permissions: [accounts.view_all_profiles]
          - key: roles
            label: 角色权限
            url_name: accounts:role_list
            icon_class: icon-[tabler--shield-lock] size-5 text-warning
            permissions: [auth.view_group]
          - key: account_invitation
            label: 生成邀请码
            url_name: accounts:generate_invitation
            icon_class: icon-[tabler--user-plus] size-5 text-info
            superuser_required: true
          - key: admin
            label: 管理后台
            url_name: admin:index
            icon_class: icon-[tabler--settings] size-5 text-neutral
            staff_required: true

  - key: about
    label: 关于
    description: 公共页面
    icon_class: icon-[tabler--info-circle] size-5 text-info
    login_required: false
    items:
      - key: about_group
        label: 关于本站
        icon_class: icon-[tabler--info-circle] size-5 text-info
        login_required: false
        children:
          - key: about_site
            label: 关于 TMS
            url: /about/site/
            icon_class: icon-[tabler--info-circle] size-5 text-info
            login_required: false
          - key: about_author
            label: 关于作者
            url: /about/author/
            icon_class: icon-[tabler--user] size-5 text-info
            login_required: false
          - key: countdown
            label: 倒计时大屏
            url_name: event_countdown:countdown
            icon_class: icon-[tabler--clock] size-5 text-info
            login_required: false
          - key: demo_ui
            label: UI 验收中心
            url_name: demo:index
            icon_class: icon-[tabler--components] size-5 text-accent
            debug_only: true
            staff_required: true
          - key: feedback_create
            label: 提交反馈
            url_name: feedback:create
            icon_class: icon-[tabler--message-plus] size-5 text-success
            login_required: true

  - key: worldskills_forum
    label: 世赛论坛
    description: 世界技能论坛翻译与讨论信息
    icon_class: icon-[tabler--messages] size-5 text-info
    items:
      - key: worldskills_forum_group
        label: 世赛论坛
        icon_class: icon-[tabler--messages] size-5 text-info
        children:
          - key: worldskills_forum
            label: 最新动态
            url_name: worldskills_forum:feed
            icon_class: icon-[tabler--news] size-5 text-info
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_topics
            label: 主题
            url_name: worldskills_forum:topic_list
            icon_class: icon-[tabler--message-circle] size-5 text-primary
            permissions: [worldskills_forum.view_forumtopic]
          - key: worldskills_forum_important
            label: 重要信息
            url_name: worldskills_forum:important_feed
            icon_class: icon-[tabler--alert-triangle] size-5 text-warning
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_official
            label: 官方信息
            url_name: worldskills_forum:official_feed
            icon_class: icon-[tabler--rosette] size-5 text-info
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_unread
            label: 未读信息
            url_name: worldskills_forum:unread_feed
            icon_class: icon-[tabler--mail] size-5 text-secondary
            permissions: [worldskills_forum.view_forumpost]
          - key: worldskills_forum_workbench
            label: 翻译工作台
            url_name: worldskills_forum:workbench
            icon_class: icon-[tabler--language] size-5 text-accent
            permissions:
              - worldskills_forum.add_forumpost

  - key: training
    label: 训练
    description: 训练周期与训练日志
    icon_class: icon-[tabler--run] size-5 text-success
    items:
      - key: training_group
        label: 训练管理
        icon_class: icon-[tabler--run] size-5 text-success
