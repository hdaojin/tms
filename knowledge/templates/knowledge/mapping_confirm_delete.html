{% extends "layouts/app.html" %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h2 class="card-title">删除技能映射</h2>
    <div role="alert" class="alert alert-warning">
      <span class="icon-[tabler--alert-triangle] size-5"></span>
      <span>删除后该映射不再参与覆盖统计。</span>
    </div>
    <form method="post" class="card-actions justify-end">
      {% csrf_token %}
      <a href="{% url 'knowledge:evidence_detail' object.evidence_id %}" class="btn">取消</a>
      <button class="btn btn-error" type="submit">确认删除</button>
    </form>
  </div>
</div>
{% endblock %}
