{% extends "layouts/app.html" %}
{% block content %}
<div class="space-y-4">
  <form class="rounded-box border border-base-300 bg-base-100 p-3 shadow-sm"
        method="get"
        action="{% url 'feedback:list' %}"
        hx-get="{% url 'feedback:list' %}"
        hx-trigger="submit, change from:.feedback-filter-select, input changed delay:400ms from:#feedback-search, search from:#feedback-search"
        hx-target="#feedback-list"
        hx-push-url="true"
        hx-indicator="#feedback-filter-indicator"
        hx-sync="this:replace">
    <div class="grid grid-cols-2 gap-2 md:flex md:items-center">
      <label class="min-w-0 md:w-32 md:shrink-0">
        <span class="sr-only">反馈类型</span>
        <select class="feedback-filter-select select w-full md:select-sm" name="category">
          <option value="">全部类型</option>
          {% for value, label in category_choices %}<option value="{{ value }}"{% if selected_category == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label class="min-w-0 md:w-32 md:shrink-0">
        <span class="sr-only">状态</span>
        <select class="feedback-filter-select select w-full md:select-sm" name="status">
          <option value="">全部状态</option>
          {% for value, label in status_choices %}<option value="{{ value }}"{% if selected_status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label class="col-span-2 min-w-0 md:w-40 md:shrink-0">
        <span class="sr-only">查看范围</span>
        <select class="feedback-filter-select select w-full md:select-sm" name="scope">
          <option value="">全部可见反馈</option>
          <option value="my"{% if selected_scope == "my" %} selected{% endif %}>我提交的</option>
        </select>
      </label>
      <div class="col-span-2 flex min-w-0 items-center gap-2 md:contents">
        <label class="min-w-0 flex-1">
          <span class="sr-only">搜索</span>
          <input id="feedback-search"
                 class="input w-full md:input-sm"
                 type="search"
                 name="q"
                 value="{{ selected_query }}"
                 placeholder="搜索标题或正文">
        </label>
        <div class="flex shrink-0 items-center gap-1">
          <span id="feedback-filter-indicator"
                class="htmx-indicator loading loading-spinner loading-sm text-primary"
                role="status"
                aria-label="正在筛选"></span>
          <a class="btn btn-ghost px-3 md:btn-sm" href="{% url 'feedback:list' %}">重置</a>
        </div>
      </div>
    </div>
  </form>

  <div id="feedback-list">
    {% include "feedback/fragments/feedback_list.html" %}
  </div>
</div>
{% endblock %}
