{% load form_extras %}
<fieldset class="fieldset md:col-span-2">
  <legend class="fieldset-legend">{{ field.label }}</legend>
  {% if field.errors %}
    <div class="alert alert-error">
      <span class="icon-[tabler--alert-circle] size-5" aria-hidden="true"></span>
      <ul class="list-disc pl-4">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
    </div>
  {% endif %}
  <div
    class="rounded-box border-2 border-dashed border-base-300 bg-base-100 p-5 transition-colors"
    x-data="feedbackAttachmentPicker"
    data-max-count="10"
    data-max-total-bytes="52428800"
    x-on:dragover="handleDragOver"
    x-on:dragleave="handleDragLeave"
    x-on:drop="handleDrop"
  >
    <label class="flex cursor-pointer flex-col items-center justify-center gap-2 text-center" tabindex="0">
      <span class="icon-[tabler--cloud-upload] size-10 text-primary" aria-hidden="true"></span>
      <span class="font-medium">拖入文件或点击选择</span>
      <span class="text-sm text-base-content/60">复制截图后直接按 Ctrl+V / Cmd+V 即可添加，无需点击此处</span>
      <span class="text-xs text-base-content/60">最多 10 个，单个文件 20MB，单次总大小 50MB</span>
      {{ field }}
    </label>
    <p class="mt-3 hidden text-sm text-error" x-show="error" x-text="error"></p>
    <ul class="mt-4 grid gap-3 sm:grid-cols-2" x-show="files.length" x-cloak>
      <template x-for="(file, index) in files" x-bind:key="fileKey(file, index)">
        <li class="flex items-center gap-3 rounded-box border border-base-300 bg-base-200 p-2">
          <template x-if="isImage(file)">
            <img class="size-14 shrink-0 rounded object-cover" x-bind:src="previewUrls[index]" x-bind:alt="file.name">
          </template>
          <template x-if="!isImage(file)">
            <span class="icon-[tabler--file] size-10 shrink-0 text-base-content/60" aria-hidden="true"></span>
          </template>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm" x-text="file.name"></span>
            <span class="block text-xs text-base-content/60" x-text="formatSize(file.size)"></span>
          </span>
          <button class="btn btn-ghost btn-circle btn-sm text-error" type="button" x-on:click="removeFile(index)" title="删除待上传附件" aria-label="删除待上传附件">
            <span class="icon-[tabler--x] size-4" aria-hidden="true"></span>
          </button>
        </li>
      </template>
    </ul>
  </div>
</fieldset>
