{% comment %}
文件上传组件。
参数: name, label, accept, multiple, required, help_text, max_size_mb, extra_class。
交互逻辑由 static/js/app.js 通过 data-file-upload 绑定。
{% endcomment %}
<div class="rounded-box border border-dashed border-base-300 bg-base-100 p-5 {{ extra_class }}" data-file-upload>
  <label class="flex cursor-pointer flex-col items-center justify-center gap-3 text-center">
    <span class="icon-[tabler--cloud-upload] size-10 text-primary" aria-hidden="true"></span>
    <span class="font-medium">{{ label|default:"选择文件" }}</span>
    <span class="text-sm text-base-content/60">
      {% if help_text %}{{ help_text }}{% else %}拖放或点击选择文件{% endif %}
      {% if max_size_mb %}，单个文件不超过 {{ max_size_mb }} MB{% endif %}
    </span>
    <input class="file-input file-input-bordered w-full max-w-md"
           type="file"
           name="{{ name }}"
           {% if accept %}accept="{{ accept }}"{% endif %}
           {% if multiple %}multiple{% endif %}
           {% if required %}required{% endif %}
           data-file-input>
  </label>
  <ul class="mt-4 hidden space-y-2 text-sm" data-file-list></ul>
</div>
