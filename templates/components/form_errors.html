{% comment %}
表单全局错误组件。
参数: form。
{% endcomment %}
{% if form.non_field_errors %}
  <div class="alert alert-error mb-4">
    <span class="icon-[tabler--alert-circle] size-5" aria-hidden="true"></span>
    <ul class="list-disc pl-4">
      {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
