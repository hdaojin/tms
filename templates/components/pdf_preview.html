{% load static %}
<div {% if manual %}data-pdf-preview-manual{% else %}data-pdf-preview{% endif %}
     data-pdf-url="{{ file_preview.preview_url }}"
     data-pdf-library="{% static 'vendor/pdfjs/pdf.mjs' %}"
     data-pdf-worker="{% static 'vendor/pdfjs/pdf.worker.mjs' %}"
     data-pdf-assets="{% static 'vendor/pdfjs/' %}">
  <p class="p-3 text-center text-sm" data-pdf-status role="status">正在加载 PDF；若无法显示，可下载文件查看。</p>
  <div class="max-h-[75vh] min-h-80 overflow-auto bg-base-200/40 p-3"
       data-pdf-viewport role="region" aria-label="PDF 文档预览" tabindex="0">
    <div class="space-y-3" data-pdf-pages></div>
  </div>
  <template data-pdf-page-template>
    <div class="relative mx-auto bg-white" role="img">
      <canvas class="absolute inset-0 h-full w-full" aria-hidden="true" hidden></canvas>
    </div>
  </template>
  <noscript><p class="p-4">PDF 在线预览需要启用 JavaScript，也可下载文件查看。</p></noscript>
</div>
