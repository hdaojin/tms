{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="csrf-token" content="{{ csrf_token }}" />
<meta name="description" content="{{ site_info.site_description }}" />
<meta name="keywords" content="{{ site_info.site_keywords }}" />
<meta name="author" content="{{ site_info.site_author }}" />
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}" />
<title>
  {% if title or flatpage.title %}
    {% firstof title flatpage.title %} | {{ site_info.site_short_name }}
  {% else %}
    {{ site_info.site_short_name }}
  {% endif %}
</title>
<script src="{% static 'js/theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/output.css' %}" />
