{% load menu_tags %}
<div class="dropdown dropdown-end" data-theme-controller>
  <button type="button" tabindex="0" class="btn btn-ghost gap-2" aria-label="切换主题">
    <span class="icon-[tabler--palette] size-5"></span>
    <span class="hidden text-sm font-medium sm:inline" data-theme-label>跟随系统</span>
  </button>
  <ul tabindex="0" class="dropdown-content menu z-30 mt-2 w-48 rounded-box border border-base-300 bg-base-100 p-2 shadow" data-theme-menu>
    <li>
      <button type="button" data-theme-value="system" data-theme-option aria-checked="true">
        <span class="icon-[tabler--check] size-4" data-theme-check></span>
        跟随系统
      </button>
    </li>
    {% enabled_themes as themes %}
    {% for theme in themes %}
      <li>
        <button type="button" data-theme-value="{{ theme }}" data-theme-option aria-checked="false">
          <span class="icon-[tabler--check] hidden size-4" data-theme-check></span>
          {% if theme == "light" %}
            浅色
          {% elif theme == "dark" %}
            深色
          {% elif theme == "corporate" %}
            企业
          {% elif theme == "business" %}
            商务
          {% elif theme == "night" %}
            夜间
          {% else %}
            {{ theme }}
          {% endif %}
        </button>
      </li>
    {% endfor %}
  </ul>
</div>
