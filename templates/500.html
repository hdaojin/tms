{% extends "layouts/minimal.html" %}

{% block content %}
  <div class="flex min-h-[70vh] flex-col items-center justify-center p-8 text-center">
    <span class="icon-[tabler--server-off] mb-6 size-28 text-error" aria-hidden="true"></span>
    <h1 class="text-4xl font-bold">500</h1>
    <p class="mt-4 max-w-md text-base-content/60">系统处理请求时发生错误，请稍后重试。</p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <button type="button" class="btn btn-outline btn-error" data-history-back>
        <span class="icon-[tabler--arrow-left] size-4" aria-hidden="true"></span>
        返回上页
      </button>
      <a href="{% url 'home' %}" class="btn btn-primary">
        <span class="icon-[tabler--home] size-4" aria-hidden="true"></span>
        返回首页
      </a>
    </div>
  </div>
{% endblock %}
