{% extends 'base_default.html' %}

{% block left_sidebar %}
{% include 'traininglogs/left_sidebar.html' %}
{% endblock left_sidebar %}

{% block article %}
  <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>

  <div class="mb-3">
    <a href="{% url 'traininglogs:training_log_statistics' %}" class="btn btn-info"><i class="fas fa-chart-bar"></i> 日志统计</a>
    
    <!-- 添加选手筛选表单 -->
    <div class="mt-3 mb-3">
      <form method="get" class="flex flex-wrap gap-2 items-end">
        <div class="form-control">
          <label class="label">
            <span class="label-text">选择选手</span>
          </label>
          <select name="player_id" class="select select-bordered">
            <option value="">所有选手</option>
            {% for player in players %}
              <option value="{{ player.id }}" {% if selected_player_id == player.id %}selected{% endif %}>
                {{ player.first_name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-primary">查询</button>
      </form>
    </div>
  </div>

  {% include 'traininglogs/training_log_table.html' %}
{% endblock %}
