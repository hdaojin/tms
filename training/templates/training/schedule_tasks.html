{% for task in record.visible_tasks %}<p><a class="link" href="{% url 'training:task_detail' task.pk %}">{{ task.title }}</a> <span class="badge badge-outline badge-sm">{{ task.get_status_display }}</span>{% if task.can_edit %} <a class="link" href="{% url 'training:task_edit' task.pk %}" hx-get="{% url 'training:task_edit' task.pk %}" hx-target="#schedule-editor">编辑</a>{% endif %}</p>{% empty %}—{% endfor %}
