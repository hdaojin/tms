{% extends is_fragment|yesno:'layouts/htmx.html,layouts/app.html' %}{% block content %}<h2 class="text-xl font-bold">清空排班确认</h2><p>以下 {{ days|length }} 个日期将清空领域、负责教练、值班教练和备注，四时段改为待排班。时间快照和变更历史保留。</p>{% for day in days %}<p>{{ day.date|date:'Y-m-d' }}</p>{% endfor %}<form method="post" hx-post="{% url 'training:schedule_bulk' plan.pk %}" hx-target="#schedule-editor">{% csrf_token %}<input type="hidden" name="token" value="{{ token }}"><label>过期调整原因和实际执行情况<textarea class="textarea w-full" name="reason"></textarea></label><button class="btn btn-error">确认清空／提交审批</button><a class="btn btn-ghost" href="{% url 'training:plan_detail' plan.pk %}">取消</a></form>{% endblock %}
