<div class="flex flex-wrap gap-2">{% if record.can_schedule %}<label class="flex items-center gap-1"><input type="checkbox" class="checkbox checkbox-sm" name="days" value="{{ record.day_id }}" form="schedule-selection">选择日期</label><a class="btn btn-outline btn-xs" href="{% url 'training:schedule_edit' record.day.training_plan_id %}?days={{ record.day_id }}" hx-get="{% url 'training:schedule_edit' record.day.training_plan_id %}?days={{ record.day_id }}" hx-target="#schedule-editor">{% if record.day.training_plan.schedule_published_at %}申请调整{% else %}排班{% endif %}</a>{% endif %}{% if record.can_fill %}<a class="btn btn-primary btn-xs" href="{% url 'training:slot_task_create' record.pk %}" hx-get="{% url 'training:slot_task_create' record.pk %}" hx-target="#schedule-editor">添加任务</a>{% endif %}</div>
