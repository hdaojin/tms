{% extends is_fragment|yesno:'layouts/htmx.html,layouts/app.html' %}{% block content %}<h2 class="text-xl font-bold">清空本时段任务确认</h2><p>{{ slot }}，共 {{ tasks|length }} 项任务。仅取消任务内容，保留排班、附件和执行历史。</p>{% for task in tasks %}<p>{{ task.title }}</p>{% endfor %}<form method="post" hx-post="{% url 'training:slot_tasks_clear' slot.pk %}" hx-target="#schedule-editor">{% csrf_token %}<input type="hidden" name="token" value="{{ token }}"><input class="input w-full" name="reason" required placeholder="清空原因"><button class="btn btn-error">确认清空任务</button><a class="btn btn-ghost" href="{% url 'training:plan_detail' plan.pk %}">取消</a></form>{% endblock %}
