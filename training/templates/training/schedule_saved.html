<p class="alert alert-success">{% if submitted %}调整申请已提交，审批前原安排保持有效。{% else %}排班已保存。{% endif %}</p>
{% if next_day %}<a class="btn btn-primary mt-3" href="{% url 'training:schedule_edit' plan.pk %}?{{ next_query }}" hx-get="{% url 'training:schedule_edit' plan.pk %}?{{ next_query }}" hx-target="#schedule-editor">继续下一天（{{ next_day.date|date:'Y-m-d' }}）</a>{% endif %}
<a class="btn btn-ghost mt-3" href="{% url 'training:plan_detail' plan.pk %}">返回计划</a>
