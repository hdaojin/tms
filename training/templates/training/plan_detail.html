{% extends "layouts/app.html" %}{% block content %}<div class="space-y-4"><section class="card border border-base-300"><div class="card-body"><div class="flex justify-between"><h2 class="card-title">{{ plan.title }}</h2>{% if perms.training.change_trainingplan %}<a class="btn btn-outline btn-sm" href="{% url 'training:plan_edit' plan.pk %}">编辑</a>{% endif %}</div><p>{{ plan.start_date }} 至 {{ plan.end_date }}</p><p class="whitespace-pre-line">{{ plan.objective }}</p></div></section><section class="card border border-base-300"><div class="card-body"><h3 class="card-title">训练任务</h3>{% for task in plan.tasks.all %}<a class="link" href="{% url 'training:task_detail' task.pk %}">{{ task }}</a>{% empty %}<p>暂无训练任务</p>{% endfor %}</div></section></div>{% endblock %}
