{% extends 'layouts/app.html' %}{% block content %}<h2 class="text-xl font-bold">选择计划和排班时段</h2><form method="get" class="flex gap-2 my-4"><input type="hidden" name="skill" value="{{ skill_id }}"><select class="select" name="plan"><option value="">选择训练计划</option>{% for plan in plans %}<option value="{{ plan.pk }}" {% if selected.pk == plan.pk %}selected{% endif %}>{{ plan.title }}</option>{% endfor %}</select><button class="btn btn-primary">查看可填写时段</button></form>{% for slot in slots %}<p><a class="link" href="{% url 'training:slot_task_create' slot.pk %}?skill={{ skill_id|urlencode }}">{{ slot }}</a></p>{% empty %}<p>没有可填写的时段，请先完成并发布排班。</p>{% endfor %}{% endblock %}
