[project]
name = "tms"
version = "0.1.6"
description = "Training Management System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-tables2>=2.7.5",
    "django>=6.0.0",
    "django-environ>=0.12.0",
    "pyyaml>=6.0.2",
    "django-htmx>=1.23.2",
    "mysqlclient>=2.2.7",
    "gunicorn>=23.0.0",
    "django-filter>=25.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "markdown2>=2.5.4",
    "psycopg>=3.3.2",
    "pillow>=12.1.0",
    "cryptography>=48.0.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "tmsproject.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = ["--reuse-db"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    ".uv-cache",
    ".venv",
    "node_modules",
    "media",
    "media-private",
    "backups",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_test_users.py" = ["E402"]
"scripts/create_traininglogs_test_data.py" = ["E402"]

[tool.ruff.format]
quote-style = "preserve"
