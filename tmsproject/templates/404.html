{% extends "base.html" %}

{% load static %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen bg-base-100">
    <div class="text-center">
        <h1 class="text-5xl font-bold text-error">404</h1>
        <p class="mt-4 text-lg">页面未找到</p>
        <p class="mt-2">您访问的页面不存在或已被删除。</p>
        <a href="{% url 'notes:list_directories' %}" class="btn btn-primary mt-6">返回首页</a>
    </div>
    <div class="mt-8">
        <img src="{% static 'images/404.png' %}" alt="404 Not Found" class="w-1/2 mx-auto">
    </div>
</div>
{% endblock %}
