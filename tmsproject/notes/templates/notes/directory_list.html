{% extends "notes/base.html" %}

{% block content %}
<div class="card bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">笔记目录</h2>
        
        {% if subdirectories %}
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {% for dir in subdirectories %}
                <div class="card bg-base-200 hover:bg-base-300 transition-colors duration-300">
                    <div class="card-body">
                        <h3 class="card-title">{{ dir }}</h3>
                        <div class="card-actions justify-end mt-4">
                            <a href="{% url 'notes:get_readme' subdirectory=dir %}" class="btn btn-primary">查看</a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info shadow-lg">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current flex-shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>暂无笔记目录。</span>
                </div>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
