<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Notes System" }}</title>
    
    <!-- 确保已经在项目中配置了Tailwind CSS和DaisyUI -->
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100">
    <div class="navbar bg-base-200 shadow-md">
        <div class="flex-1">
            <a href="{% url 'notes:list_directories' %}" class="btn btn-ghost normal-case text-xl">笔记系统</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1">
                <li><a href="{% url 'notes:list_directories' %}">所有目录</a></li>
            </ul>
        </div>
    </div>

    <div class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer footer-center p-4 bg-base-200 text-base-content mt-auto">
        <div>
            <p>Copyright © 2023 - 笔记系统</p>
        </div>
    </footer>
</body>
</html>
