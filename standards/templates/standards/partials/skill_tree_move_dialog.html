<dialog class="tms-side-dialog" data-skill-tree-dialog aria-labelledby="skill-tree-move-title">
  <section class="tms-side-dialog-panel flex min-h-0 flex-col">
    <header class="flex items-start justify-between gap-4 border-b border-base-300 px-4 py-4 sm:px-6">
      <div>
        <h2 id="skill-tree-move-title" class="text-xl font-bold">调整树位置</h2>
        <p class="text-sm text-base-content/60">{{ node.skill.name }}</p>
      </div>
      <button type="button" class="btn btn-square btn-ghost btn-sm" data-skill-tree-dialog-close aria-label="关闭调整树位置">
        <span class="icon-[tabler--x] size-5" aria-hidden="true"></span>
      </button>
    </header>
    <form method="post" class="flex min-h-0 flex-1 flex-col" hx-post="{% url 'standards:tree_node_move' tree.pk node.pk %}" hx-target="#skill-tree-dialog" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="flex-1 space-y-4 overflow-y-auto px-4 py-5 sm:px-6">
        {% include "components/form_errors.html" with form=move_form %}
        {% include "components/field.html" with field=move_form.new_parent %}
        <p class="text-sm text-base-content/60">移动只调整当前版本中的树位置，不会修改长期技能属性，也不会自动增加关联技术领域。</p>
      </div>
      <footer class="flex justify-end gap-3 border-t border-base-300 px-4 py-4 sm:px-6">
        <button class="btn btn-ghost" type="button" data-skill-tree-dialog-close>取消</button>
        <button class="btn btn-primary" type="submit">确认移动</button>
      </footer>
    </form>
  </section>
</dialog>
