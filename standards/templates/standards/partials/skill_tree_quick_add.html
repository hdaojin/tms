<form
  method="post"
  class="space-y-3"
  hx-post="{% if parent %}{% url 'standards:tree_quick_add_child' tree.pk domain.pk parent.pk %}{% else %}{% url 'standards:tree_quick_add_root' tree.pk domain.pk %}{% endif %}"
  hx-target="this"
  hx-swap="outerHTML"
  data-skill-tree-quick-add
>
  {% csrf_token %}
  {% include "components/form_errors.html" with form=quick_add_form %}
  <label class="form-control">
    <span class="label-text mb-1">{% if parent %}在“{{ parent.skill.name }}”下新增{% else %}新增根技能{% endif %}</span>
    <input
      type="text"
      name="name"
      value="{{ quick_add_form.name.value|default:'' }}"
      class="input input-bordered w-full"
      maxlength="200"
      required
      autocomplete="off"
      placeholder="输入技能名称，按 Enter 提交"
      hx-get="{% if parent %}{% url 'standards:tree_candidates_child' tree.pk domain.pk parent.pk %}{% else %}{% url 'standards:tree_candidates_root' tree.pk domain.pk %}{% endif %}"
      hx-trigger="input changed delay:350ms, search"
      hx-target="#skill-tree-candidates-{{ domain.pk }}-{% if parent %}{{ parent.pk }}{% else %}root{% endif %}"
      hx-swap="innerHTML"
      data-skill-tree-name-input
    />
  </label>
  <div id="skill-tree-candidates-{{ domain.pk }}-{% if parent %}{{ parent.pk }}{% else %}root{% endif %}">
    {% include "standards/partials/skill_tree_candidates.html" %}
  </div>
  <div class="flex justify-end gap-2">
    <button type="reset" class="btn btn-ghost btn-sm" data-skill-tree-cancel>取消</button>
    <button type="submit" class="btn btn-primary btn-sm">保存</button>
  </div>
</form>
