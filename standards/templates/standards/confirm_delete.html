{% extends "layouts/app.html" %}

{% block content %}
  <section class="card border border-error/30 bg-base-100 shadow-sm">
    <div class="card-body gap-4">
      <h2 class="card-title text-error">{{ title }}</h2>
      <p>对象：{{ object }}</p>
      <p class="text-sm text-base-content/70">{{ message }}</p>
      <form method="post" class="flex justify-end gap-2">
        {% csrf_token %}
        <a class="btn btn-ghost" href="{{ cancel_url }}">取消</a>
        <button class="btn btn-error" type="submit">确认</button>
      </form>
    </div>
  </section>
{% endblock %}
