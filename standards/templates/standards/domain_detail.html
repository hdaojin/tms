{% extends "layouts/app.html" %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 class="card-title">能力领域信息</h2>
        <p class="text-sm text-base-content/70">{{ domain.skill_project }} / {{ domain.code }}</p>
      </div>
      {% if perms.standards.change_capabilitydomain %}
        <a href="{% url 'standards:domain_edit' domain.pk %}" class="btn btn-outline btn-sm">编辑</a>
      {% endif %}
    </div>
    <p class="whitespace-pre-line">{{ domain.description|default:"暂无描述" }}</p>
  </div>
</div>
{% endblock %}
