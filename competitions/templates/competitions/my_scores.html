{% regroup scores by examination as exam_list %}

{% for group in exam_list %}
  <h2 class="font-bold text-lg mt-4">
    {{ group.grouper.name }}（{{ group.grouper.date }}）
  </h2>

  <table class="table table-sm w-full">
    <thead>
      <tr>
        <th>模块</th>
        <th>分值</th>
      </tr>
    </thead>
    <tbody>
      {% for s in group.list %}
        <tr>
          <td>{{ s.module.name }}</td>
          <td>{{ s.score }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endfor %}
