---
- name: 竞赛信息
  icon: icon-[tabler--trophy]
  is_group_header: true
  children:
    - name: 竞赛列表
      named_url: competitions:competition_list
      icon: icon-[tabler--list-details]
      is_visible: true
      login_required: true
    - name: 新增代表队
      named_url: competitions:member_create
      icon: icon-[tabler--flag]
      is_visible: true
      login_required: true
      required_perms:
        - competitions.add_member
    - name: 新增选手
      named_url: competitions:competitor_create
      icon: icon-[tabler--user-plus]
      is_visible: true
      login_required: true
      required_perms:
        - competitions.add_competitor
    - name: 新增专家
      named_url: competitions:expert_create
      icon: icon-[tabler--user-star]
      is_visible: true
      login_required: true
      required_perms:
        - competitions.add_expert
    - name: 新增岗位人员
      named_url: competitions:skillposition_create
      icon: icon-[tabler--briefcase-2]
      is_visible: true
      login_required: true
      required_perms:
        - competitions.add_skillposition
    - name: 录入竞赛总成绩
      named_url: competitions:competitionresult_create
      icon: icon-[tabler--chart-bar]
      is_visible: true
      login_required: true
      required_perms:
        - competitions.add_competitionresult