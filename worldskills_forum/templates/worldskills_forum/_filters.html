<form method="get" class="card border border-base-300 bg-base-100 shadow-sm">
  <div class="card-body grid gap-3 md:grid-cols-4">
    <label class="form-control md:col-span-2"><span class="label-text mb-1">关键字</span><input class="input w-full" type="search" name="q" value="{{ filters.q }}" placeholder="搜索中英文、作者、标签和附件名称"></label>
    <label class="form-control"><span class="label-text mb-1">年份</span><select class="select w-full" name="year"><option value="">全部年份</option>{% for year in years %}<option value="{{ year }}" {% if filters.year == year|stringformat:'s' %}selected{% endif %}>{{ year }}</option>{% endfor %}</select></label>
    <label class="form-control"><span class="label-text mb-1">模块</span><select class="select w-full" name="module"><option value="">全部模块</option>{% for item in modules %}<option value="{{ item.pk }}" {% if filters.module == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
    <label class="form-control"><span class="label-text mb-1">分类</span><select class="select w-full" name="category"><option value="">全部分类</option>{% for item in categories %}<option value="{{ item.pk }}" {% if filters.category == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
    <label class="form-control"><span class="label-text mb-1">标签</span><select class="select w-full" name="tag"><option value="">全部标签</option>{% for item in tags %}<option value="{{ item.pk }}" {% if filters.tag == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
    {% if post_types %}<label class="form-control"><span class="label-text mb-1">信息类型</span><select class="select w-full" name="post_type"><option value="">全部类型</option>{% for value,label in post_types %}<option value="{{ value }}" {% if filters.post_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endif %}
    {% if status_choices %}<label class="form-control"><span class="label-text mb-1">状态</span><select class="select w-full" name="status"><option value="">全部状态</option>{% for value,label in status_choices %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endif %}
    <label class="form-control"><span class="label-text mb-1">重要程度</span><select class="select w-full" name="importance"><option value="">全部程度</option>{% for value,label in importance_choices %}<option value="{{ value }}" {% if filters.importance == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <div class="flex flex-wrap justify-end gap-2 md:col-span-4"><a class="btn btn-ghost" href="{{ request.path }}">清除</a><button class="btn btn-primary" type="submit">筛选</button></div>
  </div>
</form>
