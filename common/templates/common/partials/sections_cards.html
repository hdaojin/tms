{% comment %}Section cards for accounts home{% endcomment %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
  {% for section in sections %}
    <div class="card bg-base-100 shadow">
      <div class="card-body items-center text-center gap-y-2">
        {% if section.icon %}
          <span class="{{ section.icon.pic }} size-{{ section.icon.size }} text-{{ section.icon.color }}"></span>
        {% else %}
          <span class="icon-[tabler--apps] text-3xl text-primary"></span>
        {% endif %}
        <h3 class="card-title">{{ section.label }}</h3>
        <p class="text-sm text-base-content/70">
          {% if section.description %}
            {{ section.description }}
          {% else %}
            进入{{ section.label }}模块
          {% endif %}
        </p>
        <div class="card-actions">
          <a href="{{ section.url }}" class="btn btn-sm {% if section.icon and section.icon.color %}btn-{{  section.icon.color }}{% else %}btn-primary{% endif %}">查看</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p class="text-sm text-base-content/60">暂未配置菜单。</p>
  {% endfor %}
</div>
