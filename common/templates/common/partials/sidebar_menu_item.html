{# 单个菜单项（递归） #}
<li class="text-sm">
  {% if item.children %}
    <details class="rounded-lg" {% if item.expanded %}open{% endif %}>
      <summary class="flex items-center justify-between gap-2 px-3 py-2 cursor-pointer select-none">
        <span class="flex items-center gap-2">
          {% if item.icon %}
            <span class="{{ item.icon }} size-4"></span>
          {% endif %}
          <span class="{% if item.active %}text-primary font-semibold{% endif %}">{{ item.name }}</span>
        </span>
      </summary>
      <ul class="pl-4 mt-1 border-l border-base-300 space-y-1" data-submenu>
        {% for child in item.children %}
          {% include "common/partials/sidebar_menu_item.html" with item=child %}
        {% endfor %}
      </ul>
    </details>
  {% else %}
    <a href="{{ item.resolved_url }}" class="flex items-center gap-2 px-3 py-2 {% if item.active %}text-primary font-semibold bg-base-200{% endif %}">
      {% if item.icon %}
        <span class="{{ item.icon }} size-4"></span>
      {% endif %}
      <span>{{ item.name }}</span>
    </a>
  {% endif %}
</li>
