{% if model.pk in usable_ids %}
  {% if model.pk == default_id %}
    <span class="badge badge-primary">默认模型</span>
  {% else %}
    <form method="post" action="{% url 'ai_models:default' model.pk %}">
      {% csrf_token %}
      <button class="btn btn-sm" type="submit" aria-label="将 {{ model.name }} 设为默认模型">设为默认</button>
    </form>
  {% endif %}
{% endif %}
