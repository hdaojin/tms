{% extends "layouts/app.html" %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 class="card-title">试题要求信息</h2>
        <p class="text-sm text-base-content/70">{{ requirement.paper }}</p>
      </div>
      {% if perms.examcontent.change_examrequirement %}
        <a href="{% url 'examcontent:requirement_edit' requirement.pk %}" class="btn btn-outline btn-sm">编辑</a>
      {% endif %}
    </div>
    <p class="whitespace-pre-line">{{ requirement.normalized_text|default:requirement.original_text }}</p>
  </div>
</div>
{% endblock %}
