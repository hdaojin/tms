<dialog id="lock-profile-modal" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">确认锁定资料</h3>
    <p class="py-4 text-sm text-base-content/70">将保存当前填写内容并锁定资料，锁定后须由管理员解锁才能编辑。</p>
    <div class="modal-action">
      <button type="submit" form="profile-form" name="action" value="lock" class="btn btn-warning">确认锁定</button>
      <button type="button" class="btn" data-modal-close="lock-profile-modal">取消</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
</dialog>
