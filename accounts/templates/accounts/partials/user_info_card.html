{# accounts/templates/accounts/partials/user_info_card.html #}
{# 用户账号信息卡片 partial #}
{# 用法: {% include 'accounts/partials/user_info_card.html' with target_user=user %} #}

<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title">
      <span class="icon-[tabler--id-badge]"></span>
      账号信息
    </h2>

    <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
      <label class="input">
        <span class="label">账号</span>
        <input type="text" value="{{ target_user.username }}" disabled />
      </label>

      <label class="input">
        <span class="label">姓名</span>
        <input type="text" value="{{ target_user.first_name|default:'未设置' }}" disabled />
      </label>

      <label class="input">
        <span class="label">邮箱</span>
        <input type="email" value="{{ target_user.email|default:'未设置' }}" disabled />
      </label>

      <div class="label">
        <span class="label-text">角色</span>
        <div class="flex flex-wrap gap-2">
          {% for role_badge in role_badges %}
            <span class="{{ role_badge.css_class }}">{{ role_badge.label }}</span>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
