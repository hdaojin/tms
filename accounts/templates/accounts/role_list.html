    <section id="permission-bundle-reference" class="space-y-4 pt-8">

        <h2 class="text-lg font-semibold">业务权限包参考</h2>

      <div class="overflow-x-auto rounded-box border border-base-300 bg-base-100">

      </div>
    </section>
  </div>
{% endblock %}
