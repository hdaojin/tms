{% extends 'base.html' %}

{% block content %}
  <!-- 邀请码内容 -->
  <div class="space-y-6 w-auto">
    <div>
      <h2 class="text-xl font-semibold flex items-center gap-2 mb-4">
        <span class="icon-[tabler--qrcode]"></span>
        邀请码
      </h2>

      <p class="text-base-content/70 mb-4">请将以下邀请码提供给需要注册的用户：</p>

      <div class="flex gap-2 items-end">
        <label class="input input-bordered flex-1">
          <span class="label">邀请码</span>
          <input type="text" readonly value="{{ code }}" id="inviteCode" />
        </label>
        <button id="copyBtn" class="btn btn-primary">
          <span class="icon-[tabler--copy]"></span>
          复制
        </button>
      </div>

      <div class="alert alert-info mt-4">
        <span class="icon-[tabler--info-circle] shrink-0"></span>
        <span>请妥善保管邀请码，只分享给需要注册的用户。</span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('copyBtn').addEventListener('click', function () {
      navigator.clipboard
        .writeText('{{ code }}')
        .then(function () {
          // 显示复制成功提示
          const btn = document.getElementById('copyBtn')
          const originalText = btn.innerHTML
          btn.innerHTML = '<span class="icon-[tabler--check]"></span>已复制'
          btn.classList.add('btn-success')
          btn.classList.remove('btn-primary')
    
          setTimeout(function () {
            btn.innerHTML = originalText
            btn.classList.remove('btn-success')
            btn.classList.add('btn-primary')
          }, 2000)
        })
        .catch(function () {
          alert('复制失败，请手动复制邀请码')
        })
    })
  </script>
{% endblock %}

{% endblock %}
