{% extends "layouts/app.html" %}

{% block content %}
  <!-- 邀请码内容 -->
  <div class="space-y-6 w-auto">
    <div>
      <h2 class="text-xl font-semibold flex items-center gap-2 mb-4">
        <span class="icon-[tabler--qrcode]"></span>
        邀请码
      </h2>

      <p class="text-base-content/70 mb-4">请将以下邀请码提供给需要注册的用户（建议复制后通过安全渠道发送）：</p>

      <div class="flex gap-2 items-end">
        <label class="input input-bordered flex-1">
          <span class="label">邀请码</span>
          <input type="text" readonly value="{{ code }}" id="inviteCode" class="font-mono text-sm" />
        </label>
        <button id="copyBtn" class="btn btn-primary" type="button" data-copy-target="#inviteCode" data-copied-label="已复制">
          <span class="icon-[tabler--copy]"></span>
          复制
        </button>
      </div>

      <div class="alert alert-info mt-4">
        <span class="icon-[tabler--info-circle] shrink-0"></span>
        <div>
          <p class="font-semibold">使用说明：</p>
          <ul class="list-disc list-inside text-sm mt-1">
            <li>点击"复制"按钮，将邀请码发送给用户</li>
            <li>邀请码有效期：24小时</li>
            <li>使用签名技术，安全防伪造</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

{% endblock %}

{% block right_sidebar %}
{% endblock %}
