{% extends 'base.html' %}
{% load static %}

{% block main %}
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
      <form method="post" novalidate class="w-full">
        {% csrf_token %}
        <fieldset class="fieldset bg-base-100 shadow-xl rounded-box p-6">
          <legend class="fieldset-legend">注册</legend>
          <div class="space-y-4">
          {% for field in form %}
            <div>
            {% if field.errors %}
              <div class="alert alert-error alert-outline mt-2">{{ field.errors }}</div>
            {% endif %}
            <label class="input input-bordered w-full">
              <span class="label">{{ field.label }}</span>
              {{ field }}
            </label>
            {% if field.help_text %}
              <p class="label text-xs opacity-70 text-primary" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</p>
            {% endif %}
            </div>
          {% endfor %}
          </div>

          <div class="mt-4 space-y-4">
            <button class="btn btn-primary w-full" type="submit">注册</button>
            <button class="btn btn-outline w-full" type="reset">重置</button>
          </div>
        </fieldset>
      </form>

      <div class="text-center mt-4">
        <p>
          已有账号? <a href="{% url 'accounts:login' %}" class="link link-accent">立即登录</a>
        </p>
      </div>
    </div>
  </div>
{% endblock %}
