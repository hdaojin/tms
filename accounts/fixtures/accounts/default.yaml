---
# permissions: ["permission_codename", "content_type.app_label", "content_type.model_name"]
- model: auth.group
  pk: 1
  fields:
    name: "教练"
    permissions:
      - ["add_traininglog", "traininglogs", "traininglog"]
      - ["view_traininglog", "traininglogs", "traininglog"]
      - ["view_competitor_traininglog", "traininglogs", "traininglog"]

- model: accounts.groupprofile
  pk: 1
  fields:
    group: 1
    codename: "coach"
    description: "教练组"
    selected_permission_bundles:
      - "traininglogs.upload_traininglog"
      - "traininglogs.view_competitor_traininglogs"

- model: auth.group
  pk: 2
  fields:
    name: "选手"
    permissions:
      - ["add_traininglog", "traininglogs", "traininglog"]
      - ["view_traininglog", "traininglogs", "traininglog"]
      - ["view_coach_traininglog", "traininglogs", "traininglog"]

- model: accounts.groupprofile
  pk: 2
  fields:
    group: 2
    codename: "competitor"
    description: "选手组"
    selected_permission_bundles:
      - "traininglogs.upload_traininglog"
      - "traininglogs.view_coach_traininglogs"

- model: auth.group
  pk: 3
  fields:
    name: "班务"
    permissions:
      - ["add_notice", "notices", "notice"]
      - ["add_meeting", "meeting", "meeting"]

- model: accounts.groupprofile
  pk: 3
  fields:
    group: 3
    codename: "assistant"
    description: "班务组"

