---
# permissions: ["permission_codename", "content_type.app_label", "content_type.model_name"]
- model: auth.group
  pk: 1
  fields:
    name: "教练"
    permissions:
      - ["view_trainingcycle", "training", "trainingcycle"]
      - ["add_trainingcycle", "training", "trainingcycle"]
      - ["change_trainingcycle", "training", "trainingcycle"]
      - ["view_traininglog", "training", "traininglog"]
      - ["add_traininglog", "training", "traininglog"]
      - ["change_traininglog", "training", "traininglog"]
      - ["view_all_traininglog", "training", "traininglog"]
      - ["export_traininglog_archive", "training", "traininglog"]

- model: accounts.groupprofile
  pk: 1
  fields:
    group: 1
    codename: "coach"
    description: "教练组"
    selected_permission_bundles:
      - "training.maintain_training"

- model: auth.group
  pk: 2
  fields:
    name: "选手"
    permissions:
      - ["view_trainingcycle", "training", "trainingcycle"]
      - ["add_trainingcycle", "training", "trainingcycle"]
      - ["change_trainingcycle", "training", "trainingcycle"]
      - ["view_traininglog", "training", "traininglog"]
      - ["add_traininglog", "training", "traininglog"]
      - ["change_traininglog", "training", "traininglog"]
      - ["view_all_traininglog", "training", "traininglog"]
      - ["export_traininglog_archive", "training", "traininglog"]

- model: accounts.groupprofile
  pk: 2
  fields:
    group: 2
    codename: "competitor"
    description: "选手组"
    selected_permission_bundles:
      - "training.maintain_training"

- model: auth.group
  pk: 3
  fields:
    name: "班务"
    permissions:
      - ["add_notice", "notices", "notice"]
      - ["add_meeting", "meetings", "meeting"]

- model: accounts.groupprofile
  pk: 3
  fields:
    group: 3
    codename: "assistant"
    description: "班务组"
    selected_permission_bundles:
      - "meetings.upload_meeting"
      - "notices.publish_notice"

