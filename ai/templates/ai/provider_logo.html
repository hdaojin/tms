{% if branding.logo_url %}
  <img data-provider-logo src="{{ branding.logo_url }}" alt="" width="28" height="28"
       class="{% if compact %}size-4{% else %}size-7{% endif %} shrink-0 object-contain">
{% elif branding.logo_icon %}
  <span data-provider-logo class="{{ branding.logo_icon }} {% if compact %}size-4{% else %}size-7{% endif %} shrink-0"
        aria-hidden="true"></span>
{% endif %}
